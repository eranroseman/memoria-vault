# Dependabot version-update PRs for the dependency surfaces that exist: GitHub
# Actions pinned in .github/workflows/, contributor/CI Python tooling at the
# repo root, and pinned pre-commit hook environments.
# Monthly + a small PR cap keeps the noise low; commit messages use the `chore`
# prefix. Every bump PR is reviewed and merged by a person (no auto-merge).
# (Security-fix PRs from Dependabot alerts are separate and not gated here.)
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
    groups:
      dev-python:
        patterns: ["*"]
    # This ecosystem also sees pyproject.toml's runtime extras, where `mcp`'s
    # upper bound is an API-compatibility bound rather than a version pin: the
    # transport is written against one major's server API (2.x `MCPServer`), so
    # crossing a major is a code change, not a bump. #1620 proposed `<3` while
    # the code still used 1.x `FastMCP` and took 33 tests red. Minor and patch
    # updates still flow.
    ignore:
      - dependency-name: mcp
        update-types: ["version-update:semver-major"]

  # An esbuild bump here always lands red and always needs two hand commits on
  # top: the seeded plugin bundle is a committed artifact that
  # `scripts/build.mjs --check` compares byte-for-byte, and a new bundler emits
  # a different prologue. 0.25.9 -> 0.28.2 rewrote `__commonJS` alone and that
  # was enough. Dependabot moves the pin; it cannot regenerate what the pin
  # builds. So on every bump PR here, run
  #   npm ci --prefix packages/memoria-obsidian
  #   npm run build --prefix packages/memoria-obsidian
  #   MEMORIA_FLOOR_UPDATE_GOLDENS=1 python -m pytest tests/test_floor_sweep_operations.py -q
  # and commit the rebuilt `main.js` with the 39 goldens that carry its digest.
  - package-ecosystem: npm
    directory: "/packages/memoria-obsidian"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
    groups:
      adapter-build:
        patterns: ["*"]
    # oxlint and oxfmt live here so the editor extension can find them; the
    # pre-commit hooks below run the same two versions. tests/test_node_tooling.py
    # fails when the two pins disagree, so this freeze must mirror the one in the
    # pre-commit ecosystem exactly or the monthly npm bump takes that test red.
    # Svelte supplies Oxfmt's Svelte parser, so its exact runtime pin participates
    # in formatter output and must move only with the hook and editor policy.
    ignore:
      - dependency-name: oxfmt
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: svelte
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
    groups:
      hook-tools:
        patterns: ["*"]
    # oxfmt is pre-1.0 and still changes its own output between releases, so a
    # routine monthly bump reformats the tree for no benefit. Blocking minor and
    # patch pins it below 1.0 -- on a 0.x line those are every release there is
    # -- and lets the 1.0 bump through as the PR that says the format has
    # settled. Dependencies here are named by repo URL, the form Dependabot's
    # own bump PRs use (#1355).
    ignore:
      - dependency-name: https://github.com/oxc-project/mirrors-oxfmt
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
