name: verify

# The single required code-validation check: scripts/verify (lint, product
# gates, tests, offline smoke, syntax). No `paths:` filter — a required check
# must report on every PR, or a path-unrelated PR is permanently blocked. The
# `push: main` run validates the post-merge state.
#
# Two fast paths keep the job reporting while doing less when it provably can:
#   - PSScriptAnalyzer is installed only when a `.ps1` file changed.
#   - A docs-only PR (whole diff is Markdown outside `src/` and/or files under
#     `design-history/`) sets VERIFY_DOCS_ONLY=1, narrowing verify to the checks
#     a docs change can affect. Markdown under `src/` is runtime package data,
#     so it never qualifies. The `push: main` run always runs the full roster.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  pull-requests: read  # the change-scope step reads a PR's changed files

jobs:
  # One leg per `SHARDS` entry in scripts/verify. The union of the shards is the
  # full roster and tests/test_verify_script.py asserts it, so a sharded CI run
  # verifies exactly what a bare local `python scripts/verify` verifies.
  #
  # This job is deliberately NOT named `verify`: a matrix publishes one check per
  # leg (`shards (lint)`, `shards (contract)`, ...), so naming it `verify` would
  # delete the `verify` check that `main` requires and block every PR. The
  # aggregating job below owns that name.
  #
  # fail-fast is off so one red shard does not cancel the others and hide a
  # second, unrelated failure behind it.
  shards:
    strategy:
      fail-fast: false
      matrix:
        shard: [lint, contract, runtime, sweep]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
      - name: Install Obsidian adapter build dependency
        run: npm ci --prefix packages/memoria-obsidian
      - name: Install runtime + dev tooling
        run: |
          python -m pip install --quiet -r requirements-dev.txt
          python -m pip install --quiet -e ".[mcp]"
      - name: Enable the code-execution sandbox (bubblewrap)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          # Ubuntu 24.04 restricts unprivileged user namespaces via AppArmor. Without
          # this, bwrap falls back to its setuid path and `--unshare-net` dies at
          # `loopback: Failed RTM_NEWADDR: Operation not permitted` -- it does not own
          # the netns it just created. Added only after CI demonstrated that failure;
          # the probe below is what tells you if it stops being needed.
          sudo sysctl -qw kernel.apparmor_restrict_unprivileged_userns=0 || true
          # Delegate the probe to the product's own execution_availability() so
          # this step can never drift from what the runtime actually requires.
          # (A hand-rolled `--ro-bind /usr /usr --ro-bind /bin /bin` probe once
          # lived here; it printed the same "FAILED to start" message on a
          # healthy runner as on a broken one, because /bin/true's ELF
          # interpreter is /lib64/ld-linux-x86-64.so.2 and /lib64 is a
          # merged-usr symlink the probe never bound — zero information either
          # way. _base_bwrap_args() binds /usr, /bin, /lib, /lib64 for exactly
          # this reason.)
          python3 -c "
          from pathlib import Path
          from memoria_vault.runtime.code.execution import execution_availability

          availability = execution_availability(Path('.'))
          if availability.available:
              print('bwrap: available')
          else:
              print(f'bwrap: unavailable — {availability.reason}')
          "
      - name: Detect change scope
        id: scope
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if ! files="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" --jq '.[].filename')"; then
            files=""
          fi
          printf 'changed files:\n%s\n' "$files"
          # Safe defaults: if the diff can't be read, run everything (full verify).
          ps1=true
          docs_only=false
          if [ -n "$files" ]; then
            printf '%s\n' "$files" | grep -qE '\.ps1$' || ps1=false
            # A file is documentation when it is under design-history/ or is
            # Markdown that is NOT shipped as package data. 66 tracked *.md live
            # under src/ (capabilities/operations/*.md, workspace_seed/) and are
            # program content: the tests that validate them are `contract`, which
            # the docs-only narrowing drops, so a PR editing only those files
            # would skip every check that reads them.
            remaining="$(
              { printf '%s\n' "$files" | grep -vE '^design-history/' | grep -vE '\.md$'
                printf '%s\n' "$files" | grep -E '^src/.*\.md$'
              } | grep -c . || true
            )"
            [ "$remaining" = "0" ] && docs_only=true
          fi
          echo "ps1=$ps1" >> "$GITHUB_OUTPUT"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "scope -> ps1=$ps1 docs_only=$docs_only"
      # Keyed per workflow. gitleaks.yml caches the same path from the same
      # config file, but installs exactly one hook environment; this job installs
      # all of them. On a shared key the 18s gitleaks job always won the race,
      # so verify got a primary-key hit on a cache holding only the gitleaks env,
      # reinstalled the other eight (68s, vale alone 45s), and actions/cache then
      # declined to save because the hit was on the primary key. Keep both halves
      # of the prefix distinct: a shared `restore-keys` fallback re-couples them.
      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: ${{ runner.os }}-pre-commit-verify-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pre-commit-verify-
      # Only bother with PSScriptAnalyzer when a .ps1 changed (empty scope output
      # on the push:main run means "run it" — full validation of the merged state).
      - name: Cache PSScriptAnalyzer module
        id: pssa-cache
        if: steps.scope.outputs.ps1 != 'false'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/powershell/Modules/PSScriptAnalyzer
          key: ${{ runner.os }}-psscriptanalyzer-v1-${{ hashFiles('scripts/PSScriptAnalyzerSettings.psd1') }}
          restore-keys: |
            ${{ runner.os }}-psscriptanalyzer-v1-
      - name: Install PSScriptAnalyzer
        if: steps.scope.outputs.ps1 != 'false' && steps.pssa-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
      # scripts/verify defaults xdist to half the cores so two local worktrees can
      # run gates side by side without thrashing (1733). A runner runs exactly one
      # gate, so it gets one worker per vCPU — this repo is public, so that is 4,
      # and the default was leaving half the runner idle. Read `nproc` rather than
      # hardcoding, so a runner resize or a private fork on the 2-vCPU tier cannot
      # silently turn this into oversubscription.
      - name: Size the test gate to the runner
        id: cpu
        run: |
          echo "workers=$(nproc)" >> "$GITHUB_OUTPUT"
          echo "xdist workers -> $(nproc)"
      - name: Run verify
        env:
          VERIFY_DOCS_ONLY: ${{ steps.scope.outputs.docs_only == 'true' && '1' || '0' }}
          MEMORIA_REQUIRE_SANDBOX: "1"
          PYTEST_XDIST_AUTO_NUM_WORKERS: ${{ steps.cpu.outputs.workers }}
          SHARD: ${{ matrix.shard }}
        run: python scripts/verify --shard "$SHARD"
      # actions/cache saves in a post step, after every normal step, so this
      # prunes environments for hook revisions no longer in the config before the
      # cache is written. Without it the chain grows unboundedly — vale's
      # environment alone is 355 MB unpacked, so one rev bump would nearly double
      # the archive and give back part of the restore-time saving. No
      # `if: always()`: actions/cache's post step is `post-if: success()`, so a
      # failed run saves nothing at all and pruning it would buy nothing.
      - name: Drop hook environments no longer referenced by the config
        run: pre-commit gc

  # The required check `main` protection names. It exists so branch protection can
  # keep pinning one stable name while the matrix above grows or shrinks.
  #
  # `if: always()` so a cancelled or skipped shard still resolves this job rather
  # than leaving the required check pending forever; the result comparison then
  # fails on anything that is not a clean success.
  verify:
    needs: shards
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every shard to have succeeded
        env:
          RESULT: ${{ needs.shards.result }}
        run: |
          echo "shards result -> $RESULT"
          if [ "$RESULT" != "success" ]; then
            echo "::error::verify shards did not all succeed ($RESULT)"
            exit 1
          fi
