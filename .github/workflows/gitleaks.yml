name: gitleaks

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pre-commit
        run: |
          # Fail here, loudly, if the pin ever moves or is renamed: a zero-match
          # grep would otherwise expand to `pip install ""`, which current pip
          # accepts as a no-op, pushing the failure to the next step as a
          # misleading "pre-commit: command not found".
          pin="$(grep -E '^pre-commit==' requirements-dev.txt)" || {
            echo "::error::no readable pre-commit== pin in requirements-dev.txt"
            exit 1
          }
          python -m pip install --quiet "$pin"
      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pre-commit
          # Distinct from verify.yml's key on purpose — see the comment there.
          key: ${{ runner.os }}-pre-commit-gitleaks-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pre-commit-gitleaks-
      - name: gitleaks detect
        run: pre-commit run gitleaks --all-files
