; Vale prose linter — the standing home for glossary usage rulings.
; Canonical vocabulary: docs/reference/data-model/glossary.md. When a ruling
; lands there, its machine form goes to .vale/styles/config/vocabularies/
; Memoria/ (accept.txt = enforced casing, reject.txt = banned aliases) in the
; same PR. Spelling stays with cspell; Vale owns terminology only.
; File scoping (docs/, minus docs/superpowers/) lives in .pre-commit-config.yaml.
;
; Two mechanisms ban strings; they split by what the string is. A retired
; surface — a path, an identifier, a shipped UI string — goes to
; scripts/checks/removed_surfaces.json, which carries an owner and a reason per
; rule and searches src/, scripts/, and tests/ as well as docs/. reject.txt here
; is for prose aliases the glossary rules against, in published prose only.

StylesPath = .vale/styles

; Vendored, not synced. The pre-commit hook runs `vale` and never `vale sync`,
; so the gate must never need the network. `.vale/styles/{Microsoft,alex,
; write-good}/` are committed; each carries a meta.json recording its source
; feed and Vale compatibility.
; To refresh: `vale sync`, review the diff, commit. Only the rules named in the
; [*.md] block below are enabled — a package is a source of rules here, not a
; style guide this project adopts.
Packages = Microsoft, alex, write-good
MinAlertLevel = error

Vocab = Memoria

[*.md]
BasedOnStyles = Vale
Vale.Spelling = NO
