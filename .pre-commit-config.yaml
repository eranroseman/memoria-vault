# Memoria pre-commit configuration.
#
# Three hooks fire on `git commit` (gitleaks, no-commit-to-branch, ruff-format);
# every other hook is manual-stage and fires only through `scripts/verify`
# (`pre-commit run --hook-stage manual`). This keeps the pinned/cached hook
# environments as the single source of the lint tools while `verify` owns the
# gate order. Install once per clone:  pre-commit install --install-hooks
# (or run scripts/dev/setup.sh). Bypass everything once:  git commit --no-verify
#
# ruff-format is the one hook that rewrites files, and `verify` runs the manual
# stage over the WORKTREE while a commit is built from the INDEX. So a run that
# reformats fails, the re-run passes against the now-clean worktree, `verify:
# OK` prints -- and the commit still carries the unformatted source, which CI
# then rejects. Re-running the gate can never detect that. Only a commit-stage
# hook can, because only it sees what is actually being committed.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: no-commit-to-branch
        args: [--branch, main]
        always_run: true
        pass_filenames: false
        stages: [pre-commit]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        always_run: true
        pass_filenames: false
        stages: [pre-commit]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      # Directory scope only: the hooks' own `types_or: [python, pyi, jupyter]`
      # decides what is Python. Spelling `\.py$` here re-encoded that and got it
      # wrong -- `scripts/verify`, the gate itself, is extensionless and was the
      # one Python file in the repo exempt from both hooks, silently.
      # `.claude/hooks/` holds the checked-in PreToolUse gate that enforces the
      # shared-index rule. Tracked, load-bearing, and outside every scope until
      # tests/test_lint_coverage.py computed the claimed set.
      - id: ruff
        files: ^(src/memoria_vault|scripts|tests|\.claude/hooks)/
        stages: [manual]

      - id: ruff-format
        files: ^(src/memoria_vault|scripts|tests|\.claude/hooks)/
        stages: [pre-commit, manual]

  # MyPy checks rather than rewrites, so the manual stage owns it. Its scope
  # comes from pyproject.toml: passing individual changed paths would lose
  # package-wide cross-module resolution.
  #
  # The exact extra pins make a cached hook environment reproducible and
  # meaningful offline. Without the runtime package and YAML stubs, third-party
  # imports collapse to Any and a green check would prove too little.
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.0
    hooks:
      - id: mypy
        pass_filenames: false
        # Override mirrors-mypy's global --ignore-missing-imports and
        # --scripts-are-modules defaults. Only pyproject.toml's fitz/mcp
        # overrides may suppress missing imports.
        args: []
        additional_dependencies:
          - types-PyYAML==6.0.12.20260724
          - pydantic-ai-slim[openai]==2.28.0
        stages: [manual]

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        files: \.(yaml|yml)$
        stages: [manual]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      # Directory scope only, for the same reason as ruff above: the hook's own
      # `types: [shell]` decides what is shell (and excludes install.ps1, which
      # identifies as powershell). The previous exact-path form lint-ed one of
      # the four tracked shell scripts and its second alternation named
      # `scripts/install/`, deleted in #1322 -- a regex matching nothing is a
      # green hook. `scripts/dev/setup.sh`, the first command CONTRIBUTING
      # gives a new contributor, was covered by no gate at all.
      # The seeded `.githooks/pre-commit` is a bash script installed into every
      # user's vault. `^scripts/` never reached it.
      - id: shellcheck
        args: [--severity=warning]
        files: ^(scripts|src/memoria_vault/product/workspace_seed/\.githooks)/
        stages: [manual]

  # oxlint at its default scope only -- the `correctness` category, the rules
  # that flag code that is wrong rather than unfashionable. The wider categories
  # were measured against this tree when the hook was added: correctness 0,
  # style 1329. Raising the scope buys a bikeshed, not a bug.
  #
  # `--deny-warnings` is what makes this a gate. oxlint reports correctness
  # findings at warning severity and exits 0 -- a planted `debugger`, and a
  # duplicate object key, both print and pass. Without the flag the hook is
  # green on every input it will ever see.
  - repo: https://github.com/oxc-project/mirrors-oxlint
    rev: v1.78.0
    hooks:
      - id: oxlint
        args: [--deny-warnings]
        files: ^(packages/memoria-obsidian|scripts/checks)/
        stages: [manual]

  # oxfmt rewrites files, so it carries the commit stage for the same reason
  # ruff-format does -- see the note at the top of this file. It is pre-1.0 and
  # its output still moves between releases, so .github/dependabot.yml holds
  # this rev until 1.0 rather than reformatting the tree every month.
  #
  # Oxfmt owns every supported non-Markdown suffix listed below. The suffix
  # regex keeps unsupported files away from the CLI, and Markdown remains out
  # because formatting it would rewrite fenced samples of real CLI output. The
  # adapter build canonicalizes generated plugin artifacts before byte-parity
  # checks, so generated JavaScript and CSS stay inside formatter ownership.
  # Keep the default filename passing behavior; never add `pass_filenames:
  # false` or a bare path argument.
  - repo: https://github.com/oxc-project/mirrors-oxfmt
    rev: v0.63.0
    hooks:
      - id: oxfmt
        types_or: [file]
        files: '\.(?:js|mjs|cjs|jsx|ts|mts|cts|tsx|json|jsonc|json5|yaml|yml|toml|css|scss|less|pcss|postcss|wxss|graphql|gql|graphqls|html|htm|hta|xhtml|component\.html|vue|svelte|hbs|handlebars|mjml)$'
        additional_dependencies: [oxfmt@0.63.0, svelte@5.56.8]
        stages: [pre-commit, manual]

  - repo: https://github.com/errata-ai/vale
    rev: v3.17.1
    hooks:
      # Terminology rulings over published docs prose (.vale.ini + the Memoria
      # vocabulary). Spelling stays with cspell; Vale owns term/casing rulings.
      - id: vale
        files: ^docs/.*\.md$
        exclude: ^docs/superpowers/
        stages: [manual]

  - repo: local
    hooks:
      # markdownlint + cspell gate published docs prose (not the docs/superpowers
      # working records). Node hooks; deps pinned so no npx/npm ci is needed.
      - id: markdownlint-structural
        name: markdownlint-structural
        language: node
        entry: markdownlint --config .markdownlint.json
        additional_dependencies: [markdownlint-cli@0.49.1]
        files: ^docs/.*\.md$
        exclude: ^docs/superpowers/
        stages: [manual]

      # Just the Docs renders mermaid client-side, so a malformed fence fails no
      # build and no test -- it only shows readers an error box. `mermaid@` here
      # must stay equal to `mermaid.version` in docs/_config.yml; the gate fails
      # on drift and tests/test_mermaid_parse_gate.py pins the pair.
      # Unlike markdownlint and cspell, whose entry is an installed bin that
      # resolves its own deps, this entry is one of our own scripts. pre-commit
      # installs these dependencies into a global prefix that Node's resolver
      # does not search for a script run by path, so the script finds that
      # prefix itself -- see the comment on `envModuleRoot`.
      - id: mermaid-parse
        name: mermaid-parse
        language: node
        entry: node scripts/checks/mermaid_parse.mjs
        additional_dependencies: [mermaid@10.9.1, jsdom@30.0.1]
        files: ^docs/.*\.md$
        exclude: ^docs/superpowers/
        stages: [manual]

      # Scope/exclusions are owned by cspell.json (files + ignorePaths +
      # enableGlobDot); there is no file list to mirror here.
      - id: cspell
        name: cspell
        language: node
        entry: cspell lint --no-progress --no-must-find-files
        additional_dependencies: [cspell@10.0.1]
        files: \.md$
        stages: [manual]
