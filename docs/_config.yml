title: Memoria
description: A standalone local research CLI and engine for checked knowledge work.
# Pinned so theme (and mermaid) behavior can't shift under the site without a
# repo change; bump deliberately.
remote_theme: just-the-docs/just-the-docs@v0.12.0

url: https://eranroseman.github.io
baseurl: /memoria-vault

# Search
search_enabled: true
search:
  heading_level: 3
  previews: 3
  preview_words_before: 5
  preview_words_after: 10

# Top-right link
aux_links:
  "GitHub":
    - "https://github.com/eranroseman/memoria-vault"
aux_links_new_tab: true

# Footer
footer_content: 'MIT License &middot; <a href="https://github.com/eranroseman/memoria-vault">eranroseman/memoria-vault</a>'

# Back to top button
back_to_top: true
back_to_top_text: "Back to top"

# Color scheme: "light" or "dark"
color_scheme: light

# Favicon
favicon_ico: "/favicon.ico"

# Mermaid diagrams (rendered natively by Just the Docs >= 0.4.0)
mermaid:
  version: "10.9.1"

# Plugins whitelisted on GitHub Pages
plugins:
  - jekyll-relative-links
  - jekyll-seo-tag
  - jekyll-sitemap

# Scratch dirs and working records under docs/ are never published.
exclude:
  - "**/tmp/"
  - "superpowers/"
